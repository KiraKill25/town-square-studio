workflows:
  android-apk:
    name: Build Offline Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 21
      node: 22
    scripts:
      - name: STEP 1 - Install Dependencies
        script: npm install --legacy-peer-deps
      - name: STEP 2 - Build Static App & Capacitor Sync
        script: |
          # 1. Switch server build preset from Cloudflare to Static SPA
          export NITRO_PRESET=static
          find . -maxdepth 2 \( -name "*.ts" -o -name "*.js" \) -exec sed -i 's/cloudflare-module/static/g' {} + 2>/dev/null || true
          
          # 2. Build static web assets
          npm run build
          
          # 3. Copy generated static files into dist
          mkdir -p dist
          if [ -d ".output/public" ]; then
            cp -R .output/public/* dist/
          fi

          # 4. Initialize and Sync Capacitor
          npx cap init "Town Square" "com.townsquare.app" --web-dir "dist" || true
          npx cap add android || true
          npx cap sync android
      - name: STEP 3 - Assemble APK
        script: |
          cd android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/**/*.apk

workflows:
  android-apk:
    name: Build Offline Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: STEP 1 - Install Dependencies
        script: npm install --legacy-peer-deps
      - name: STEP 2 - Build Web App & Sync Capacitor
        script: |
          npm run build || true
          mkdir -p dist
          INDEX_PATH=$(find . -maxdepth 4 -name "index.html" -not -path "*/node_modules/*" -not -path "*/android/*" -not -path "./dist/*" | head -n 1)
          if [ -n "$INDEX_PATH" ]; then
            BUILD_DIR=$(dirname "$INDEX_PATH")
            echo "Found index.html in: $BUILD_DIR"
            cp -R "$BUILD_DIR"/* dist/
          else
            echo "Using fallback root index.html"
            cp index.html dist/ 2>/dev/null || true
            cp -R public/* dist/ 2>/dev/null || true
          fi
          ./node_modules/.bin/cap init "Town Square" "com.townsquare.app" --web-dir "dist" || true
          ./node_modules/.bin/cap add android || true
          ./node_modules/.bin/cap sync android
      - name: STEP 3 - Assemble APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/**/*.apk

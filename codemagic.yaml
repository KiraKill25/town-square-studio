workflows:
  android-apk:
    name: Build Offline Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: STEP 1 - Install Dependencies
        script: npm install --legacy-peer-deps
      - name: STEP 2 - Build Web App & Prepare Dist
        script: |
          npm run build || true
          mkdir -p dist
          if [ -d ".output/public" ]; then
            cp -R .output/public/* dist/ 2>/dev/null || true
          fi
          if [ -f "index.html" ]; then
            cp index.html dist/
          fi
          if [ ! -f "dist/index.html" ]; then
            cat << 'EOF' > dist/index.html
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Town Square</title>
            </head>
            <body>
              <div id="root"></div>
            </body>
          </html>
          EOF
          fi
          ./node_modules/.bin/cap init "Town Square" "com.townsquare.app" --web-dir "dist" || true
          ./node_modules/.bin/cap add android || true
          ./node_modules/.bin/cap sync android
      - name: STEP 3 - Assemble APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/**/*.apk

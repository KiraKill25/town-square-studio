workflows:
  android-apk:
    name: Build Offline Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 21
      node: 22
    scripts:
      - name: STEP 1 - Install Dependencies
        script: npm install --legacy-peer-deps
      - name: STEP 2 - Build Web App & Capacitor Sync
        script: |
          npm run build || true

          mkdir -p dist
          if [ -d ".output/public" ]; then
            cp -R .output/public/* dist/ 2>/dev/null || true
          fi

          node -e '
          const { spawn } = require("child_process");
          const fs = require("fs");
          const path = require("path");
          const http = require("http");

          const distDir = path.join(process.cwd(), "dist");
          const serverDir = path.join(process.cwd(), ".output", "server");

          const safeProxyCode = `
          <script>
            window.global = window;
            window.process = window.process || { env: { NODE_ENV: "production" } };
            
            function createRecursiveProxy() {
              const dummy = function() {};
              return new Proxy(dummy, {
                get(target, prop) {
                  if (prop in target) return target[prop];
                  if (typeof prop === "symbol" || prop === "then" || prop === "toJSON") return undefined;
                  target[prop] = createRecursiveProxy();
                  return target[prop];
                },
                set(target, prop, val) {
                  target[prop] = val;
                  return true;
                }
              });
            }

            const globalsToProtect = [
              "__VINXI__", "__TSR__", "__TSR_ROUTER__", "__TSR_DEHYDRATED__", 
              "__manifest__", "__nitro__", "$fetch", "router"
            ];

            globalsToProtect.forEach(g => {
              if (!window[g]) window[g] = createRecursiveProxy();
            });
          </script>
          `;

          async function buildApp() {
            let serverFile = "";
            if (fs.existsSync(serverDir)) {
              const files = fs.readdirSync(serverDir);
              serverFile = files.find(f => f === "index.mjs" || f === "nitro.mjs" || f === "server.mjs") || files.find(f => f.endsWith(".mjs"));
            }

            let capturedHtml = "";

            if (serverFile) {
              const serverPath = path.join(serverDir, serverFile);
              console.log("Found server entry:", serverPath);
              const PORT = 3456;
              const proc = spawn("node", [serverPath], {
                env: { ...process.env, PORT: PORT, HOST: "127.0.0.1" },
                stdio: "ignore"
              });

              await new Promise(r => setTimeout(r, 3500));

              await new Promise((resolve) => {
                http.get(`http://127.0.0.1:${PORT}/`, (res) => {
                  let html = "";
                  res.on("data", chunk => html += chunk);
                  res.on("end", () => {
                    if (html && html.includes("<html")) {
                      capturedHtml = html;
                      console.log("Successfully captured SSR rendered HTML!");
                    }
                    proc.kill();
                    resolve();
                  });
                }).on("error", (err) => {
                  console.log("Local server fetch error:", err.message);
                  proc.kill();
                  resolve();
                });
              });
            }

            let indexPath = path.join(distDir, "index.html");

            if (capturedHtml) {
              if (capturedHtml.includes("<head>")) {
                capturedHtml = capturedHtml.replace("<head>", "<head>" + safeProxyCode);
              } else {
                capturedHtml = safeProxyCode + capturedHtml;
              }
              fs.writeFileSync(indexPath, capturedHtml);
            } else if (fs.existsSync(indexPath)) {
              let html = fs.readFileSync(indexPath, "utf8");
              if (html.includes("<head>")) {
                html = html.replace("<head>", "<head>" + safeProxyCode);
              } else {
                html = safeProxyCode + html;
              }
              fs.writeFileSync(indexPath, html);
            }
          }

          buildApp();
          '

          cat << EOF > capacitor.config.json
          {
            "appId": "com.townsquare.app",
            "appName": "Town Square",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          npx cap add android || true
          npx cap sync android
      - name: STEP 3 - Assemble APK
        script: |
          cd android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/**/*.apk

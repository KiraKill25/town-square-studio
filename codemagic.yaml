workflows:
  android-apk:
    name: Build Offline Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 21
      node: 22
    scripts:
      - name: STEP 1 - Install Dependencies
        script: npm install --legacy-peer-deps
      - name: STEP 2 - Build Web App & Capacitor Sync
        script: |
          npm run build || true

          cat << 'EOF' > prepare-dist.cjs
          const fs = require("fs");
          const path = require("path");

          const distDir = path.join(process.cwd(), "dist");
          fs.mkdirSync(distDir, { recursive: true });

          const outputPublic = path.join(process.cwd(), ".output", "public");
          if (fs.existsSync(outputPublic)) {
            fs.cpSync(outputPublic, distDir, { recursive: true });
          }

          const buildAssets = path.join(distDir, "_build", "assets");
          const assetsDir = path.join(distDir, "assets");
          if (fs.existsSync(buildAssets)) {
            fs.mkdirSync(assetsDir, { recursive: true });
            fs.cpSync(buildAssets, assetsDir, { recursive: true });
          }

          let jsFiles = [];
          let cssFiles = [];

          if (fs.existsSync(assetsDir)) {
            const files = fs.readdirSync(assetsDir);
            jsFiles = files.filter(f => f.endsWith(".js"));
            cssFiles = files.filter(f => f.endsWith(".css"));
          }

          // Strictly find ONLY the entry JS file, excluding route chunks
          let entryJs = "";

          const manifestPaths = [
            path.join(distDir, "manifest.json"),
            path.join(distDir, "_build", "manifest.json"),
            path.join(distDir, ".vite", "manifest.json")
          ];
          for (const mp of manifestPaths) {
            if (fs.existsSync(mp)) {
              try {
                const manifest = JSON.parse(fs.readFileSync(mp, "utf8"));
                for (const k in manifest) {
                  if (manifest[k].isEntry && manifest[k].file) {
                    entryJs = path.basename(manifest[k].file);
                    break;
                  }
                }
              } catch(e) {}
            }
            if (entryJs) break;
          }

          if (!entryJs) {
            entryJs = jsFiles.find(f => f.startsWith("client") || f.startsWith("entry-client"));
          }
          if (!entryJs) {
            entryJs = jsFiles.find(f => f.startsWith("main") || f.startsWith("app") || f.startsWith("entry"));
          }
          if (!entryJs) {
            entryJs = jsFiles.find(f => {
              if (f.startsWith("index-") || f.startsWith("route-")) return false;
              const content = fs.readFileSync(path.join(assetsDir, f), "utf8");
              return content.includes("createRoot") || content.includes("hydrateRoot") || content.includes("ReactDOM");
            });
          }
          if (!entryJs) {
            entryJs = jsFiles.find(f => !f.startsWith("index-") && !f.startsWith("route-"));
          }

          console.log("Selected Entry JS Point:", entryJs);

          const cssTags = cssFiles.map(f => `<link rel="stylesheet" href="./assets/${f}">`).join("\n    ");
          const jsTag = entryJs ? `<script type="module" src="./assets/${entryJs}"></script>` : "";

          const htmlContent = `<!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Town Square</title>
              ${cssTags}
              <script>
                if (window.location.pathname.endsWith('/index.html') || window.location.pathname.endsWith('index.html')) {
                  window.history.replaceState(null, '', '/');
                }

                window.global = window;
                window.process = window.process || { env: { NODE_ENV: "production" } };
                window.__VINXI__ = window.__VINXI__ || { assets: {} };
                window.__manifest__ = window.__manifest__ || {};
                window.__TSR__ = window.__TSR__ || {};
                window.__TSR_ROUTER__ = window.__TSR_ROUTER__ || {};
                window.__TSR_DEHYDRATED__ = window.__TSR_DEHYDRATED__ || {};
                window.__nitro__ = window.__nitro__ || {};
                window.$fetch = window.$fetch || function() { return Promise.resolve({}); };

                window.addEventListener("error", function(e) {
                  var d = document.createElement("div");
                  d.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;z-index:99999;background:#111;color:#ff5555;padding:20px;font-family:monospace;font-size:12px;overflow:scroll;white-space:pre-wrap;word-break:break-all;";
                  d.innerText = "APP RUNTIME ERROR:\\n" + e.message + "\\n\\nFile: " + e.filename + ":" + e.lineno + "\\n\\nStack:\\n" + (e.error ? e.error.stack : "N/A");
                  document.body.appendChild(d);
                });
                window.addEventListener("unhandledrejection", function(e) {
                  var d = document.createElement("div");
                  d.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;z-index:99999;background:#111;color:#ff5555;padding:20px;font-family:monospace;font-size:12px;overflow:scroll;white-space:pre-wrap;word-break:break-all;";
                  d.innerText = "UNHANDLED PROMISE REJECTION:\\n" + (e.reason ? (e.reason.stack || e.reason) : e);
                  document.body.appendChild(d);
                });
              </script>
            </head>
            <body>
              <div id="root"></div>
              <div id="app"></div>
              <div id="__next"></div>
              ${jsTag}
            </body>
          </html>`;

          fs.writeFileSync(path.join(distDir, "index.html"), htmlContent);
          EOF

          node prepare-dist.cjs

          cat << EOF > capacitor.config.json
          {
            "appId": "com.townsquare.app",
            "appName": "Town Square",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          npx cap add android || true
          npx cap sync android
      - name: STEP 3 - Assemble APK
        script: |
          cd android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/**/*.apk

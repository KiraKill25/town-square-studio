workflows:
  android-apk:
    name: Build Offline Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 21
      node: 22
    scripts:
      - name: STEP 1 - Install Dependencies
        script: npm install --legacy-peer-deps
      - name: STEP 2 - Build & Prepare Static Assets
        script: |
          git checkout -- . || true

          npm run build || true

          cat << 'EOF' > copy-dist.cjs
          const fs = require("fs");
          const path = require("path");

          const distDir = path.join(process.cwd(), "dist");
          fs.mkdirSync(distDir, { recursive: true });

          const outputPublic = path.join(process.cwd(), ".output", "public");
          if (fs.existsSync(outputPublic)) {
            fs.cpSync(outputPublic, distDir, { recursive: true });
          }

          let indexPath = path.join(distDir, "index.html");
          if (!fs.existsSync(indexPath)) {
            if (fs.existsSync(path.join(distDir, "200.html"))) {
              fs.copyFileSync(path.join(distDir, "200.html"), indexPath);
            } else if (fs.existsSync(path.join(distDir, "404.html"))) {
              fs.copyFileSync(path.join(distDir, "404.html"), indexPath);
            }
          }

          const buildAssets = path.join(distDir, "_build", "assets");
          const assetsDir = path.join(distDir, "assets");
          if (fs.existsSync(buildAssets)) {
            fs.mkdirSync(assetsDir, { recursive: true });
            fs.cpSync(buildAssets, assetsDir, { recursive: true });
          }
          if (fs.existsSync(assetsDir)) {
            fs.mkdirSync(buildAssets, { recursive: true });
            fs.cpSync(assetsDir, buildAssets, { recursive: true });
          }

          if (fs.existsSync(indexPath)) {
            let html = fs.readFileSync(indexPath, "utf8");
            const urlFixScript = `
            <script>
              (function() {
                if (window.location.pathname.endsWith('/index.html') || window.location.pathname.includes('index.html')) {
                  window.history.replaceState(null, '', '/');
                }
              })();
            </script>
            `;
            if (html.includes("<head>")) {
              html = html.replace("<head>", "<head>" + urlFixScript);
            } else {
              html = urlFixScript + html;
            }
            fs.writeFileSync(indexPath, html);
          }

          console.log("Static distribution directory successfully prepared!");
          EOF

          node copy-dist.cjs

          cat << EOF > capacitor.config.json
          {
            "appId": "com.townsquare.app",
            "appName": "Town Square",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          npx cap add android || true
          npx cap sync android
      - name: STEP 3 - Assemble APK
        script: |
          cd android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/**/*.apk

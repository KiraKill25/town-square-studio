workflows:
  android-apk:
    name: Build Offline Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 17
      node: 22
    scripts:
      - name: STEP 1 - Install Dependencies
        script: npm install --legacy-peer-deps
      - name: STEP 2 - Build Web App & Capacitor Sync
        script: |
          npm run build || true
          mkdir -p dist
          if [ -d ".output/public" ]; then
            cp -R .output/public/* dist/ 2>/dev/null || true
          fi
          if [ -f "index.html" ]; then
            cp index.html dist/ 2>/dev/null || true
          fi
          if [ ! -f "dist/index.html" ]; then
            echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Town Square</title></head><body><div id="root"></div></body></html>' > dist/index.html
          fi
          npx cap init "Town Square" "com.townsquare.app" --web-dir "dist" || true
          npx cap add android || true
          npx cap sync android
      - name: STEP 3 - Assemble APK
        script: |
          cd android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/**/*.apk

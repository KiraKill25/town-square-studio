workflows:
  android-apk:
    name: Build Offline Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 21
      node: 22
    scripts:
      - name: STEP 1 - Install Dependencies
        script: npm install --legacy-peer-deps
      - name: STEP 2 - Build & Prepare Static Assets
        script: |
          git checkout -- . || true

          npm run build || true

          cat << 'EOF' > copy-dist.cjs
          const fs = require("fs");
          const path = require("path");

          const distDir = path.join(process.cwd(), "dist");
          fs.mkdirSync(distDir, { recursive: true });

          // Copy Nitro public build output
          const outputPublic = path.join(process.cwd(), ".output", "public");
          if (fs.existsSync(outputPublic)) {
            fs.cpSync(outputPublic, distDir, { recursive: true });
          }

          // Ensure assets exist at both /assets and /_build/assets
          const buildAssets = path.join(distDir, "_build", "assets");
          const assetsDir = path.join(distDir, "assets");
          fs.mkdirSync(buildAssets, { recursive: true });
          fs.mkdirSync(assetsDir, { recursive: true });

          if (fs.existsSync(buildAssets)) {
            fs.cpSync(buildAssets, assetsDir, { recursive: true });
          }
          if (fs.existsSync(assetsDir)) {
            fs.cpSync(assetsDir, buildAssets, { recursive: true });
          }

          let indexPath = path.join(distDir, "index.html");
          if (!fs.existsSync(indexPath)) {
            if (fs.existsSync(path.join(distDir, "200.html"))) {
              fs.copyFileSync(path.join(distDir, "200.html"), indexPath);
            } else if (fs.existsSync(path.join(distDir, "404.html"))) {
              fs.copyFileSync(path.join(distDir, "404.html"), indexPath);
            }
          }

          // Automatically construct index.html if missing from SSR build
          if (!fs.existsSync(indexPath)) {
            console.log("No index.html found. Generating static HTML shell...");

            let jsFiles = [];
            let cssFiles = [];

            const scanDir = (dir) => {
              if (fs.existsSync(dir)) {
                const files = fs.readdirSync(dir);
                files.forEach(f => {
                  if (f.endsWith(".js")) jsFiles.push(f);
                  if (f.endsWith(".css")) cssFiles.push(f);
                });
              }
            };

            scanDir(buildAssets);
            scanDir(assetsDir);

            jsFiles = [...new Set(jsFiles)];
            cssFiles = [...new Set(cssFiles)];

            let entryJs = jsFiles.find(f => f.startsWith("client") || f.startsWith("entry-client"));
            if (!entryJs) entryJs = jsFiles.find(f => f.startsWith("main") || f.startsWith("app") || f.startsWith("entry"));
            if (!entryJs) entryJs = jsFiles.find(f => !f.startsWith("route-") && !f.startsWith("index-"));
            if (!entryJs && jsFiles.length > 0) entryJs = jsFiles[0];

            console.log("Detected CSS assets:", cssFiles);
            console.log("Detected JS entry point:", entryJs);

            const cssTags = cssFiles.map(f => `<link rel="stylesheet" href="./assets/${f}">`).join("\n    ");
            const jsTag = entryJs ? `<script type="module" src="./assets/${entryJs}"></script>` : "";

            const htmlContent = `<!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Town Square</title>
              ${cssTags}
              <script>
                (function() {
                  if (window.location.pathname.endsWith('/index.html') || window.location.pathname.includes('index.html')) {
                    window.history.replaceState(null, '', '/');
                  }
                  window.global = window;
                  window.process = window.process || { env: { NODE_ENV: "production" } };
                })();
              </script>
            </head>
            <body>
              <div id="root"></div>
              <div id="app"></div>
              <div id="__next"></div>
              ${jsTag}
            </body>
          </html>`;

            fs.writeFileSync(indexPath, htmlContent);
            console.log("Generated dist/index.html successfully!");
          } else {
            let html = fs.readFileSync(indexPath, "utf8");
            const urlFixScript = `
            <script>
              (function() {
                if (window.location.pathname.endsWith('/index.html') || window.location.pathname.includes('index.html')) {
                  window.history.replaceState(null, '', '/');
                }
                window.global = window;
                window.process = window.process || { env: { NODE_ENV: "production" } };
              })();
            </script>
            `;
            if (html.includes("<head>")) {
              html = html.replace("<head>", "<head>" + urlFixScript);
            } else {
              html = urlFixScript + html;
            }
            fs.writeFileSync(indexPath, html);
          }

          console.log("Static distribution directory successfully prepared!");
          EOF

          node copy-dist.cjs

          cat << EOF > capacitor.config.json
          {
            "appId": "com.townsquare.app",
            "appName": "Town Square",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          npx cap add android || true
          npx cap sync android
      - name: STEP 3 - Assemble APK
        script: |
          cd android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/**/*.apk

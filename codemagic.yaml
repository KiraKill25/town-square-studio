workflows:
  android-apk:
    name: Build Offline Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 21
      node: 22
    scripts:
      - name: STEP 1 - Install Dependencies
        script: npm install --legacy-peer-deps
      - name: STEP 2 - Build Web App & Capacitor Sync
        script: |
          # Restore modified config files from previous run
          git checkout -- . || true

          cat << 'EOF' > enable-spa.cjs
          const fs = require("fs");
          const path = require("path");

          // Target ONLY TanStack Start configs, leaving vite.config.ts untouched
          const appConfigFiles = ["app.config.ts", "app.config.js", "app.config.mjs"];
          let patched = false;

          for (const file of appConfigFiles) {
            const filePath = path.join(process.cwd(), file);
            if (fs.existsSync(filePath)) {
              let content = fs.readFileSync(filePath, "utf8");
              if (!content.includes("ssr: false")) {
                console.log(`Patching ${file} for SPA mode...`);
                content = content.replace(/defineConfig\s*\(\s*\{/, "defineConfig({\n  ssr: false,");
                fs.writeFileSync(filePath, content);
                console.log(`Successfully patched ${file}`);
              } else {
                console.log(`${file} already has ssr: false.`);
              }
              patched = true;
              break;
            }
          }

          if (!patched) {
            console.log("No app.config found. Keeping default setup.");
          }
          EOF

          node enable-spa.cjs

          npm run build || true

          cat << 'EOF' > prepare-dist.cjs
          const fs = require("fs");
          const path = require("path");

          const distDir = path.join(process.cwd(), "dist");
          fs.mkdirSync(distDir, { recursive: true });

          const outputPublic = path.join(process.cwd(), ".output", "public");
          if (fs.existsSync(outputPublic)) {
            fs.cpSync(outputPublic, distDir, { recursive: true });
          }

          const buildAssets = path.join(distDir, "_build", "assets");
          const assetsDir = path.join(distDir, "assets");
          if (fs.existsSync(buildAssets)) {
            fs.mkdirSync(assetsDir, { recursive: true });
            fs.cpSync(buildAssets, assetsDir, { recursive: true });
          }

          if (fs.existsSync(assetsDir)) {
            fs.mkdirSync(buildAssets, { recursive: true });
            fs.cpSync(assetsDir, buildAssets, { recursive: true });
          }

          let indexPath = path.join(distDir, "index.html");
          if (!fs.existsSync(indexPath)) {
            if (fs.existsSync(path.join(distDir, "200.html"))) {
              fs.copyFileSync(path.join(distDir, "200.html"), indexPath);
            } else if (fs.existsSync(path.join(distDir, "404.html"))) {
              fs.copyFileSync(path.join(distDir, "404.html"), indexPath);
            }
          }

          if (!fs.existsSync(indexPath) && fs.existsSync(assetsDir)) {
            const files = fs.readdirSync(assetsDir);
            const jsFiles = files.filter(f => f.endsWith(".js"));
            const cssFiles = files.filter(f => f.endsWith(".css"));

            let entryJs = jsFiles.find(f => f.startsWith("client") || f.startsWith("entry-client"));
            if (!entryJs) entryJs = jsFiles.find(f => f.startsWith("main") || f.startsWith("app") || f.startsWith("entry"));
            if (!entryJs) entryJs = jsFiles.find(f => !f.startsWith("index-") && !f.startsWith("route-"));

            const cssTags = cssFiles.map(f => `<link rel="stylesheet" href="./assets/${f}">`).join("\n");
            const jsTag = entryJs ? `<script type="module" src="./assets/${entryJs}"></script>` : "";

            const fallbackHtml = `<!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Town Square</title>
              ${cssTags}
            </head>
            <body>
              <div id="root"></div>
              <div id="app"></div>
              <div id="__next"></div>
              ${jsTag}
            </body>
          </html>`;
            fs.writeFileSync(indexPath, fallbackHtml);
          }

          if (fs.existsSync(indexPath)) {
            let html = fs.readFileSync(indexPath, "utf8");
            const patchScript = `
            <script>
              if (window.location.pathname.endsWith('/index.html') || window.location.pathname.endsWith('index.html')) {
                window.history.replaceState(null, '', '/');
              }
              window.global = window;
              window.process = window.process || { env: { NODE_ENV: "production" } };
              window.__VINXI__ = window.__VINXI__ || { assets: {} };
              window.__manifest__ = window.__manifest__ || {};
              window.__TSR__ = window.__TSR__ || {};
              window.__TSR_ROUTER__ = window.__TSR_ROUTER__ || {};
              window.__TSR_DEHYDRATED__ = window.__TSR_DEHYDRATED__ || {};
              window.__nitro__ = window.__nitro__ || {};
              window.$fetch = window.$fetch || function() { return Promise.resolve({}); };
            </script>
            `;
            if (html.includes("<head>")) {
              html = html.replace("<head>", "<head>" + patchScript);
            } else {
              html = patchScript + html;
            }
            fs.writeFileSync(indexPath, html);
            console.log("Successfully prepared dist/index.html!");
          }
          EOF

          node prepare-dist.cjs

          cat << EOF > capacitor.config.json
          {
            "appId": "com.townsquare.app",
            "appName": "Town Square",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          npx cap add android || true
          npx cap sync android
      - name: STEP 3 - Assemble APK
        script: |
          cd android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/**/*.apk

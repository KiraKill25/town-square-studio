workflows:
  android-apk:
    name: Build Offline Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 21
      node: 22
    scripts:
      - name: STEP 1 - Install Dependencies
        script: npm install --legacy-peer-deps
      - name: STEP 2 - Build Web App & Capacitor Sync
        script: |
          cat << 'EOF' > enable-spa.cjs
          const fs = require("fs");
          const path = require("path");

          const configFiles = ["app.config.ts", "app.config.js", "app.config.mjs", "vite.config.ts", "vite.config.js"];
          let patched = false;

          for (const file of configFiles) {
            const filePath = path.join(process.cwd(), file);
            if (fs.existsSync(filePath)) {
              let content = fs.readFileSync(filePath, "utf8");
              if (!content.includes("ssr: false")) {
                console.log(`Patching ${file} for SPA mode...`);
                if (content.includes("defineConfig({")) {
                  content = content.replace("defineConfig({", "defineConfig({\n  ssr: false,");
                  patched = true;
                } else if (content.includes("defineConfig(")) {
                  content = content.replace("defineConfig(", "defineConfig({\n  ssr: false\n},");
                  patched = true;
                }
                if (patched) {
                  fs.writeFileSync(filePath, content);
                  console.log(`Successfully updated ${file} with ssr: false`);
                }
              } else {
                console.log(`${file} already has ssr: false configured.`);
                patched = true;
              }
            }
          }

          if (!patched) {
            console.log("Creating default app.config.ts with ssr: false...");
            fs.writeFileSync(
              path.join(process.cwd(), "app.config.ts"),
              `import { defineConfig } from '@tanstack/start/config';\nexport default defineConfig({ ssr: false });\n`
            );
          }
          EOF

          node enable-spa.cjs

          npm run build || true

          cat << 'EOF' > prepare-dist.cjs
          const fs = require("fs");
          const path = require("path");

          const distDir = path.join(process.cwd(), "dist");
          fs.mkdirSync(distDir, { recursive: true });

          const outputPublic = path.join(process.cwd(), ".output", "public");
          if (fs.existsSync(outputPublic)) {
            fs.cpSync(outputPublic, distDir, { recursive: true });
          }

          const buildAssets = path.join(distDir, "_build", "assets");
          const assetsDir = path.join(distDir, "assets");
          if (fs.existsSync(buildAssets)) {
            fs.mkdirSync(assetsDir, { recursive: true });
            fs.cpSync(buildAssets, assetsDir, { recursive: true });
          }

          let indexPath = path.join(distDir, "index.html");
          if (!fs.existsSync(indexPath)) {
            if (fs.existsSync(path.join(distDir, "200.html"))) {
              fs.copyFileSync(path.join(distDir, "200.html"), indexPath);
            } else if (fs.existsSync(path.join(distDir, "404.html"))) {
              fs.copyFileSync(path.join(distDir, "404.html"), indexPath);
            }
          }

          if (fs.existsSync(indexPath)) {
            let html = fs.readFileSync(indexPath, "utf8");
            const resetScript = `
            <script>
              if (window.location.pathname.endsWith('/index.html') || window.location.pathname.endsWith('index.html')) {
                window.history.replaceState(null, '', '/');
              }
            </script>
            `;
            if (html.includes("<head>")) {
              html = html.replace("<head>", "<head>" + resetScript);
            } else {
              html = resetScript + html;
            }
            fs.writeFileSync(indexPath, html);
            console.log("Successfully prepared static dist/index.html!");
          } else {
            console.error("Warning: index.html was not generated.");
          }
          EOF

          node prepare-dist.cjs

          cat << EOF > capacitor.config.json
          {
            "appId": "com.townsquare.app",
            "appName": "Town Square",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          npx cap add android || true
          npx cap sync android
      - name: STEP 3 - Assemble APK
        script: |
          cd android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/**/*.apk

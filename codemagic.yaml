workflows:
  android-apk:
    name: Build Offline Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 21
      node: 22
    scripts:
      - name: STEP 1 - Install Dependencies
        script: npm install --legacy-peer-deps
      - name: STEP 2 - Build Web App & Capacitor Sync
        script: |
          npm run build || true
          mkdir -p dist
          if [ -d ".output/public" ]; then
            cp -R .output/public/* dist/ 2>/dev/null || true
          fi
          
          # Automatically detect compiled JS and CSS bundles and link them into index.html
          JS_TAGS=""
          ENTRY_JS=$(find dist/assets -name "index-*.js" -o -name "main-*.js" -o -name "client-*.js" 2>/dev/null)
          if [ -z "$ENTRY_JS" ]; then
            ENTRY_JS=$(find dist/assets -name "*.js" 2>/dev/null)
          fi
          for jsfile in $ENTRY_JS; do
            REL_JS=$(echo "$jsfile" | sed 's|^dist/|./|')
            JS_TAGS="$JS_TAGS <script type=\"module\" src=\"$REL_JS\"></script>"
          done

          CSS_TAGS=""
          for cssfile in $(find dist/assets -name "*.css" 2>/dev/null); do
            REL_CSS=$(echo "$cssfile" | sed 's|^dist/|./|')
            CSS_TAGS="$CSS_TAGS <link rel=\"stylesheet\" href=\"$REL_CSS\">"
          done

          cat << EOF > dist/index.html
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Town Square</title>
              $CSS_TAGS
            </head>
            <body>
              <div id="root"></div>
              <div id="app"></div>
              $JS_TAGS
            </body>
          </html>
          EOF

          npx cap init "Town Square" "com.townsquare.app" --web-dir "dist" || true
          npx cap add android || true
          npx cap sync android
      - name: STEP 3 - Assemble APK
        script: |
          cd android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/**/*.apk

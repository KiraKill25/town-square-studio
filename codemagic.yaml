workflows:
  android-apk:
    name: Build Offline Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: STEP 1 - Install Dependencies
        script: npm install --legacy-peer-deps
      - name: STEP 2 - Build Web App & Sync Capacitor
        script: |
          npx vite build || npm run build || true
          mkdir -p dist
          if [ ! -f "dist/index.html" ]; then
            if [ -f "index.html" ]; then
              cp index.html dist/
            fi
          fi
          ./node_modules/.bin/cap init "Town Square" "com.townsquare.app" --web-dir "dist" || true
          ./node_modules/.bin/cap add android || true
          ./node_modules/.bin/cap sync android
      - name: STEP 3 - Assemble APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/**/*.apk

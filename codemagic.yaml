workflows:
  android-apk:
    name: Build Offline Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 21
      node: 22
    scripts:
      - name: STEP 1 - Install Dependencies
        script: npm install --legacy-peer-deps
      - name: STEP 2 - Build Static Web App & Capacitor Sync
        script: |
          export SSR=false
          export VITE_SSR=false
          export NITRO_PRESET=static
          npm run build || true

          mkdir -p dist
          if [ -d ".output/public" ]; then
            cp -R .output/public/* dist/ 2>/dev/null || true
          fi

          node -e '
          const fs = require("fs");
          const path = require("path");

          const distDir = path.join(process.cwd(), "dist");
          const assetsDir = path.join(distDir, "assets");

          let indexPath = path.join(distDir, "index.html");
          if (!fs.existsSync(indexPath)) {
            if (fs.existsSync(path.join(distDir, "200.html"))) {
              fs.copyFileSync(path.join(distDir, "200.html"), indexPath);
            } else if (fs.existsSync(path.join(distDir, "404.html"))) {
              fs.copyFileSync(path.join(distDir, "404.html"), indexPath);
            }
          }

          let jsFiles = [];
          let cssFiles = [];

          if (fs.existsSync(assetsDir)) {
            const files = fs.readdirSync(assetsDir);
            jsFiles = files.filter(f => f.endsWith(".js"));
            cssFiles = files.filter(f => f.endsWith(".css"));
          }

          // Smart Entry Detection: find the script that initializes React/App root
          let entryJs = "";
          for (const f of jsFiles) {
            const content = fs.readFileSync(path.join(assetsDir, f), "utf8");
            if (content.includes("createRoot") || content.includes("hydrateRoot") || content.includes("ReactDOM") || content.includes("$Router") || content.includes("mount(")) {
              entryJs = f;
              break;
            }
          }

          if (!entryJs) {
            const priorityPatterns = [
              f => f.startsWith("client") || f.startsWith("entry-client"),
              f => f.startsWith("main"),
              f => f.startsWith("entry"),
              f => f.startsWith("app"),
              f => f.startsWith("root"),
              f => !f.startsWith("index-") && !f.startsWith("route-"),
              f => true
            ];
            for (const pattern of priorityPatterns) {
              const match = jsFiles.find(pattern);
              if (match) { entryJs = match; break; }
            }
          }

          const polyfillScript = `
          <script>
            window.global = window;
            window.process = window.process || { env: { NODE_ENV: "production" } };
            window.__VINXI__ = window.__VINXI__ || { assets: {} };
            window.__manifest__ = window.__manifest__ || {};
            window.__TSR__ = window.__TSR__ || {};
            window.__TSR_ROUTER__ = window.__TSR_ROUTER__ || {};
            window.__TSR_DEHYDRATED__ = window.__TSR_DEHYDRATED__ || {};
            window.__nitro__ = window.__nitro__ || {};
            window.$fetch = window.$fetch || function() { return Promise.resolve({}); };

            window.addEventListener("error", function(e) {
              var d = document.createElement("div");
              d.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;z-index:99999;background:#111;color:#ff5555;padding:20px;font-family:monospace;font-size:12px;overflow:scroll;white-space:pre-wrap;word-break:break-all;";
              d.innerText = "APP RUNTIME ERROR:\\n" + e.message + "\\n\\nFile: " + e.filename + ":" + e.lineno + "\\n\\nStack:\\n" + (e.error ? e.error.stack : "N/A");
              document.body.appendChild(d);
            });
            window.addEventListener("unhandledrejection", function(e) {
              var d = document.createElement("div");
              d.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;z-index:99999;background:#111;color:#ff5555;padding:20px;font-family:monospace;font-size:12px;overflow:scroll;white-space:pre-wrap;word-break:break-all;";
              d.innerText = "UNHANDLED PROMISE REJECTION:\\n" + (e.reason ? (e.reason.stack || e.reason) : e);
              document.body.appendChild(d);
            });
          </script>
          `;

          if (fs.existsSync(indexPath)) {
            let html = fs.readFileSync(indexPath, "utf8");
            if (html.includes("<head>")) {
              html = html.replace("<head>", "<head>" + polyfillScript);
            } else {
              html = polyfillScript + html;
            }
            fs.writeFileSync(indexPath, html);
          } else {
            const jsTag = entryJs ? `<script type="module" src="./assets/${entryJs}"></script>` : "";
            const cssTags = cssFiles.map(f => `<link rel="stylesheet" href="./assets/${f}">`).join("\n    ");

            const htmlContent = `<!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Town Square</title>
              ${cssTags}
              ${polyfillScript}
            </head>
            <body>
              <div id="root"></div>
              <div id="app"></div>
              ${jsTag}
            </body>
          </html>`;

            fs.writeFileSync(indexPath, htmlContent);
          }
          '

          cat << EOF > capacitor.config.json
          {
            "appId": "com.townsquare.app",
            "appName": "Town Square",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          npx cap add android || true
          npx cap sync android
      - name: STEP 3 - Assemble APK
        script: |
          cd android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
